map $uri $cache_control {
    ~^/_astro/      "public, max-age=31536000, immutable";
    ~^/fonts/       "public, max-age=31536000, immutable";
    ~^/assets/      "public, max-age=604800";
    ~^/docs/images/ "public, max-age=86400";
    ~\.(css|js)$    "public, max-age=3600";
    default         "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;
    # Relative Location headers, so redirects keep the scheme and host the visitor used (behind the HTTPS proxy too).
    absolute_redirect off;

    # The essays moved into the blog (website-blog D8); old links keep working.
    location = /essays/ { return 301 /blog/category/ownership/; }
    location = /essays { return 301 /blog/category/ownership/; }
    location ~ ^/essays/([a-z0-9-]+)/?$ { return 301 /blog/$1/; }

    # Guidance pages became one Learn library (website-learn); old index links keep working.
    location = /help/ { return 301 /learn/; }
    location = /help { return 301 /learn/; }
    location = /guides/ { return 301 /learn/methods/; }
    location = /guides { return 301 /learn/methods/; }
    location = /how-to/ { return 301 /learn/how-tos/; }
    location = /how-to { return 301 /learn/how-tos/; }
    location = /toolkit/ { return 301 /learn/setup/; }
    location = /toolkit { return 301 /learn/setup/; }
    location = /topics/ { return 301 /learn/; }
    location = /topics { return 301 /learn/; }
    location ~ ^/topics/(task-management|time-management|habits-and-routines|working-together|owning-your-data)/?$ { return 301 /learn/topic/$1/; } # e.g. /topics/task-management/ /topics/owning-your-data
    location ~ ^/guides/tag/(task-management|prioritisation|procrastination)/?$ { return 301 /learn/topic/task-management/; } # e.g. /guides/tag/procrastination/
    location ~ ^/guides/tag/(time-management|focus)/?$ { return 301 /learn/topic/time-management/; } # e.g. /guides/tag/focus/
    location ~ ^/guides/tag/habits/?$ { return 301 /learn/topic/habits-and-routines/; } # e.g. /guides/tag/habits/
    location ~ ^/guides/tag/(teamwork|goals)/?$ { return 301 /learn/topic/working-together/; } # e.g. /guides/tag/goals/
    location ~ ^/guides/tag/ownership/?$ { return 301 /learn/topic/owning-your-data/; } # e.g. /guides/tag/ownership/
    # What it costs and the FAQ are part of Compare (website-compare-v2), in English only.
    location = /cost/ { return 301 /vs/#cost; }
    location = /cost { return 301 /vs/#cost; }
    location = /faq/ { return 301 /vs/#faq; }
    location = /faq { return 301 /vs/#faq; }
    location ~ ^/(de|es|fr|it|pt)/cost/?$ { return 301 /vs/#cost; } # e.g. /de/cost/ /it/cost
    location ~ ^/(de|es|fr|it|pt)/faq/?$ { return 301 /vs/#faq; } # e.g. /fr/faq/
    # What's new became the release posts and the app's release notes (website-retire-whats-new).
    location = /whats-new/ { return 301 /blog/category/releases/; }
    location = /whats-new { return 301 /blog/category/releases/; }
    location = /whats-new/0.3.0/ { return 301 /blog/opentodo-0-3-0/; }
    location = /whats-new/0.6.0/ { return 301 /blog/opentodo-0-6-0/; }
    location = /whats-new/0.9.0/ { return 301 /blog/opentodo-0-9-0/; }
    location = /whats-new/0.7.2/ { return 301 https://github.com/OpenTodoApp/OpenTodo/releases/tag/v0.8.0; }
    location ~ ^/whats-new/([0-9][0-9a-z.-]*)/?$ { return 301 https://github.com/OpenTodoApp/OpenTodo/releases/tag/v$1; } # e.g. /whats-new/0.10.1/ /whats-new/0.3.1-rc.1

    location = /feed.xml { types { } default_type application/rss+xml; }
    # Pages and docs are /<path>/index.html; an unknown path is a real 404.
    location / { try_files $uri $uri/index.html $uri/ =404; }
}
